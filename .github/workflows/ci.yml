name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    # Fails if a Strava Client ID, secret or token is committed (also catches
    # edits made on github.com, which skip the local git hook).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-secrets.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
